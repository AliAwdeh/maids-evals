<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Maids Evals{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/">
        <strong>Maids Evals</strong>
        <span>Batch prompt review for support conversations</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="/" class="{% if nav == 'run' %}active{% endif %}" {% if nav == 'run' %}aria-current="page"{% endif %}>New run</a>
        <a href="/export" class="{% if nav == 'results' %}active{% endif %}" {% if nav == 'results' %}aria-current="page"{% endif %}>Results</a>
        <a href="/review" class="{% if nav == 'review' %}active{% endif %}" {% if nav == 'review' %}aria-current="page"{% endif %}>Review</a>
        <span class="nav-gap" aria-hidden="true"></span>
        <a href="/prompts/history" class="{% if nav == 'prompts' %}active{% endif %}" {% if nav == 'prompts' %}aria-current="page"{% endif %}>Prompts</a>
        <a href="/runs" class="{% if nav == 'history' %}active{% endif %}" {% if nav == 'history' %}aria-current="page"{% endif %}>History</a>
        {% if is_admin %}
        <a href="/admin/users" class="{% if nav == 'admin' %}active{% endif %}" {% if nav == 'admin' %}aria-current="page"{% endif %}>Admin</a>
        {% endif %}
        <span class="who">{{ user }}</span>
        <form action="/logout" method="post" style="display:inline;">
          <button type="submit" class="linkish">Log out</button>
        </form>
      </nav>
    </header>
    {% block body %}{% endblock %}
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
